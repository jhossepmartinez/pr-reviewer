name: "OpenCode PR Reviewer"
description: "Reviews pull requests using the OpenCode API"
inputs:
  opencode_api_key:
    description: "OpenCode API key"
    required: true
  github_token:
    description: "GitHub token for posting comments"
    required: true
    default: ${{ github.token }}
runs:
  using: "node20"
  main: "dist/index.mjs"
